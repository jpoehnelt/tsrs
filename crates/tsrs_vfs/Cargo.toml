[package]
name = "tsrs_vfs"
version = "7.1.0-beta.tsrs1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
categories.workspace = true
homepage.workspace = true
keywords.workspace = true
repository.workspace = true
readme.workspace = true
include = ["/src", "/build.rs", "/LICENSE", "/NOTICE", "/libs"]
description = "Virtual filesystem and bundled TypeScript libraries for tsrs"

[lints]
workspace = true

[features]
# Read standard libraries beside the executable, as in upstream npm builds.
noembed = []
# Preserve all embedded files, inflating each lossless entry only when read.
compressed-stdlib = ["dep:miniz_oxide"]

[dependencies]
tsrs_core.workspace = true
rustc-hash.workspace = true
rayon.workspace = true
bitflags.workspace = true
miniz_oxide = { version = "0.9.1", optional = true }

[build-dependencies]
miniz_oxide = { version = "0.9.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[lib]
test = false
doctest = false
