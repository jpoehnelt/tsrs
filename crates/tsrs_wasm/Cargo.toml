[package]
name = "tsrs_wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Rust consumers link the rlib into their own module. tools/wasm/build.sh explicitly selects
# cdylib for standalone WASM: selecting both crate types together would disable fat LTO.
[lib]
crate-type = ["rlib"]
# The tests run `run()` on native targets against an in-memory host (`host::test_host`).
test = true

[features]
embedded = []

[dependencies]
tsrs_core.workspace = true
tsrs_ast.workspace = true
tsrs_diagnostics.workspace = true
tsrs_scanner.workspace = true
tsrs_vfs.workspace = true
tsrs_compiler.workspace = true
tsrs_execute = { path = "../tsrs_execute" }
tsrs_contentmapper = { path = "../tsrs_contentmapper" }

tsrs_api.workspace = true
tsrs_ls.workspace = true
tsrs_lsproto.workspace = true
tsrs_project.workspace = true

